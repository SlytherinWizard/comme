name: comme_flutter
description: Commercial application
publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: '3.11.4'
  flutter: '3.41.6'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  comme_client:
    path: ../comme_client
  
  cupertino_icons: ^1.0.5
  serverpod_flutter: 3.4.7
  serverpod_auth_idp_flutter: 3.4.7
  flutter_bloc: 9.1.1
  go_router: 17.2.2
  http: 1.6.0
  google_fonts: 8.0.2
  google_sign_in: 7.2.0
  sign_in_with_apple:   7.0.1
  mapbox_maps_flutter: 2.22.0

dev_dependencies:
  flutter_lints: '>=3.0.0 <7.0.0'
  flutter_test:
    sdk: flutter


flutter:

  uses-material-design: true

  assets:
    - assets/config.json

dependency_overrides:
  flutter_secure_storage: ^10.0.0
