services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: comme
      POSTGRES_PASSWORD: "k0BJyDN2Y2VmFA7QdjmAABMSD4efFkGm"
    volumes:
      - comme_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "TWRXYAA2q7MueH4keNenHEKEXUvg2ecA"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: comme_test
      POSTGRES_PASSWORD: "OHtcUYp7tG11o8KbHuGVKF9OuTkBQIaQ"
    volumes:
      - comme_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "WUJi0LfAbfSYNYmakLhpF4sIEffpryDZ"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  comme_data:
  comme_test_data:
